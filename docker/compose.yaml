# Muxr — dev rig: muxrd + muxrctl over SSH.
#
# Loopback (default — safe, nothing exposed):
#   docker compose -f docker/compose.yaml up --build
#
# LAN exposure (a phone on the same network can reach the server):
#   BIND_ADDR=<lan-ip> docker compose -f docker/compose.yaml up --build
#
# Tailnet / remote IP exposure:
#   The container binds 0.0.0.0 internally; BIND_ADDR selects which host
#   interface the ports are published on. Inside the container the tailnet IP
#   is not a local interface (it's a host-side NAT), so the server cannot
#   discover it automatically. MUXRD_SAN injects it into the TLS cert
#   SAN so clients connecting on that IP get a valid cert. By default
#   MUXRD_SAN falls back to BIND_ADDR, so just setting BIND_ADDR is
#   enough for the common case:
#
#   BIND_ADDR=100.x.y.z docker compose -f docker/compose.yaml up --build
#
#   Override MUXRD_SAN explicitly if the cert must cover a different
#   or additional address (comma-separated list accepted).
#
# Or use the helper wrapper:
#   ./docker/run.sh --host <lan-ip>
#
# Opt-in rigs, one profile each (they publish the same ports — run ONE at a time):
#   --profile herdr → muxrd-herdr  herdr only            (./docker/run.sh --herdr)
#   --profile both  → muxrd-both   zellij + herdr        (./docker/run.sh --both)
#   --profile tmux  → muxrd-tmux   tmux only             (./docker/run.sh --tmux)
#   --profile all   → muxrd-all    zellij + herdr + tmux (./docker/run.sh --all)
# The tmux rigs carry tmux built from its release tarball, checked against the
# pinned TMUX_SHA256 before it is unpacked (see the Dockerfile).
#
# Then SSH in and drive it with muxrctl (host keys rotate per rebuild — use the
# known_hosts-free wrapper):
#   ./docker/ssh.sh <host> 2222    # no password
#   muxrctl                      # Configure → Cert → Tokens → Server → Pair
#
# muxrctl starts the gRPC server on :50051; the cert is self-signed (pair by
# scanning the QR, or trust the PEM / use the app's insecure-dev mode).
services:
  # ── Default rig: zellij backend ──────────────────────────────────────────────
  muxrd:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Explicit target so `docker compose up` builds ONLY the zellij runtime and
      # never the opt-in herdr stage (runtime-herdr).
      target: runtime
      args:
        ZELLIJ_VERSION: "${ZELLIJ_VERSION:-0.46.0}"   # 0.46.0 or 0.45.1, the zellij versions muxrd supports
    image: muxr-grpc-rig
    container_name: muxr-grpc-rig
    # BIND_ADDR controls which host interface the ports are published on.
    # Default 127.0.0.1 → loopback only (nothing leaves the host).
    # Set to a LAN IP to publish on the network.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRPC_PORT:-50051}:50051"
      # SSH — attach and drive muxrctl.
      - "${BIND_ADDR:-127.0.0.1}:${SSH_PORT:-2222}:22"
    environment:
      BACKEND: zellij
      SESSION: "${SESSION:-backend-dev}"
      # Inject the tailnet/LAN IP into the TLS cert SANs. Inside the container
      # the host's tailnet IP is not a local interface (it's a host-side NAT
      # publish), so the server cannot auto-discover it. This falls back to
      # BIND_ADDR so that `BIND_ADDR=<ip> docker compose up` is all that's
      # needed. Stays empty when the default loopback is used — safe/unchanged.
      MUXRD_SAN: "${MUXRD_SAN:-${BIND_ADDR:-}}"
      # In-container muxr-notify (FCM_MODE=log, e2e push-notification testing —
      # never published to the host). See docker/entrypoint.sh start_notify().
      NOTIFY_ENABLED: "${NOTIFY_ENABLED:-1}"
      NOTIFY_PORT: "${NOTIFY_PORT:-8090}"
    volumes:
      # Persist token DB, cert, session state, and zellij config across restarts.
      # muxrd data lives under zellij's XDG share dir.
      # docker compose down -v resets everything.
      - zellij-data:/root/.local/share/zellij
      - zellij-config:/root/.config/zellij
    stdin_open: true
    tty: true

  # ── Opt-in rig: herdr backend ────────────────────────────────────────────────
  # Exercises muxrd's herdr backend (`muxrd --backend herdr`). Gated behind the
  # `herdr` profile so it is built/started ONLY on demand:
  #   docker compose -f docker/compose.yaml --profile herdr up --build muxrd-herdr
  #   # or:  ./docker/run.sh --herdr
  # Publishes the same host ports as the zellij rig — run ONE at a time.
  # herdr is a separate, unmodified, user-installed binary (Apache-2.0); muxrd drives
  # it only over its public 0600 sockets and stays the TLS/bearer boundary.
  muxrd-herdr:
    profiles: ["herdr"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime-herdr
      args:
        ZELLIJ_VERSION: "${ZELLIJ_VERSION:-0.46.0}"   # 0.46.0 or 0.45.1, the zellij versions muxrd supports
        HERDR_VERSION: "${HERDR_VERSION:-0.9.5}"   # pinned to the last TESTED release (protocol 22); bump with wire.rs — see Dockerfile
    image: muxr-herdr-rig
    container_name: muxr-herdr-rig
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRPC_PORT:-50051}:50051"
      - "${BIND_ADDR:-127.0.0.1}:${SSH_PORT:-2222}:22"
    environment:
      BACKEND: herdr
      SESSION: "${SESSION:-herdr-dev}"
      MUXRD_SAN: "${MUXRD_SAN:-${BIND_ADDR:-}}"
      # In-container muxr-notify (FCM_MODE=log, e2e push-notification testing —
      # never published to the host). See docker/entrypoint.sh start_notify().
      NOTIFY_ENABLED: "${NOTIFY_ENABLED:-1}"
      NOTIFY_PORT: "${NOTIFY_PORT:-8090}"
    volumes:
      # muxrd's token DB + cert still live under the XDG share dir; herdr keeps its
      # own workspace/session state under ~/.config/herdr. Separate volumes from the
      # zellij rig so the two rigs don't share credential/session state.
      - muxrd-herdr-data:/root/.local/share/zellij
      - herdr-data:/root/.config/herdr
    stdin_open: true
    tty: true

  # ── Multi-backend rig: zellij AND herdr at once (Phase 3 serve-all) ──────────
  # The on-device test rig for simultaneous multi-backend. Uses the runtime-herdr
  # image (both binaries) but runs the entrypoint in BACKEND=both mode: it starts a
  # zellij session AND a headless herdr server and leaves MUXRD_BACKEND UNSET, so
  # the muxrctl-spawned muxrd auto-detects and serves BOTH backends. Both expose a
  # session named "${SESSION}" so you can verify same-name cross-backend routing
  # (the app distinguishes them by the backend badge: zellij green / herdr blue).
  # Gated behind the `both` profile; publishes the same host ports — run ONE rig at
  # a time.
  #   docker compose -f docker/compose.yaml --profile both up --build muxrd-both
  #   # or:  ./docker/run.sh --both [--host <lan-ip>]
  muxrd-both:
    profiles: ["both"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime-herdr
      args:
        ZELLIJ_VERSION: "${ZELLIJ_VERSION:-0.46.0}"   # 0.46.0 or 0.45.1, the zellij versions muxrd supports
        HERDR_VERSION: "${HERDR_VERSION:-0.9.5}"   # pinned to the last TESTED release (protocol 22); bump with wire.rs — see Dockerfile
    image: muxr-both-rig
    container_name: muxr-both-rig
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRPC_PORT:-50051}:50051"
      - "${BIND_ADDR:-127.0.0.1}:${SSH_PORT:-2222}:22"
    environment:
      BACKEND: both
      SESSION: "${SESSION:-backend-dev}"
      MUXRD_SAN: "${MUXRD_SAN:-${BIND_ADDR:-}}"
      # In-container muxr-notify (FCM_MODE=log, e2e push-notification testing —
      # never published to the host). See docker/entrypoint.sh start_notify().
      NOTIFY_ENABLED: "${NOTIFY_ENABLED:-1}"
      NOTIFY_PORT: "${NOTIFY_PORT:-8090}"
    volumes:
      # Dedicated volumes so the multi-backend rig doesn't share credential/session
      # state with the zellij-only or herdr-only rigs. muxrd's token DB + cert live
      # under the XDG share dir; herdr keeps its workspace state under ~/.config/herdr;
      # zellij config (managed, plugin-disabled) under ~/.config/zellij.
      - muxrd-both-data:/root/.local/share/zellij
      - zellij-both-config:/root/.config/zellij
      - herdr-both-data:/root/.config/herdr
    stdin_open: true
    tty: true

  # ── Opt-in rig: tmux backend ────────────────────────────────────────────────
  # Exercises muxrd's tmux backend (`MUXRD_BACKEND=tmux`) against a tmux built
  # from source at a pinned, checksum-verified release, replacing the
  # distribution's older tmux so the image has exactly one. Gated behind the
  # `tmux` profile:
  #   docker compose -f docker/compose.yaml --profile tmux up --build muxrd-tmux
  #   # or:  ./docker/run.sh --tmux
  # Publishes the same host ports as the zellij rig — run ONE at a time.
  muxrd-tmux:
    profiles: ["tmux"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime-tmux
      args:
        # 0.46.0 or 0.45.1, the zellij versions muxrd supports
        ZELLIJ_VERSION: "${ZELLIJ_VERSION:-0.46.0}"
        # Pinned tmux release and its tarball digest; they move together — see
        # the Dockerfile.
        TMUX_VERSION: "${TMUX_VERSION:-3.8}"
        TMUX_SHA256: "${TMUX_SHA256:-e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e}"
    image: muxr-tmux-rig
    container_name: muxr-tmux-rig
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRPC_PORT:-50051}:50051"
      - "${BIND_ADDR:-127.0.0.1}:${SSH_PORT:-2222}:22"
    environment:
      BACKEND: tmux
      SESSION: "${SESSION:-backend-dev}"
      MUXRD_SAN: "${MUXRD_SAN:-${BIND_ADDR:-}}"
      # In-container muxr-notify (FCM_MODE=log, e2e push-notification testing —
      # never published to the host). See docker/entrypoint.sh start_notify().
      NOTIFY_ENABLED: "${NOTIFY_ENABLED:-1}"
      NOTIFY_PORT: "${NOTIFY_PORT:-8090}"
    volumes:
      # muxrd's token DB + cert live under the XDG share dir; tmux keeps no
      # state of its own. A dedicated volume, so this rig shares no credential
      # state with the others.
      - muxrd-tmux-data:/root/.local/share/zellij
    stdin_open: true
    tty: true

  # ── Multi-backend rig: zellij, herdr AND tmux at once ────────────────────────
  # Uses the runtime-herdr-tmux image (all three binaries) and runs the
  # entrypoint in BACKEND=all mode: it starts a zellij session, a headless herdr
  # server and a tmux session, and leaves MUXRD_BACKEND UNSET so the
  # muxrctl-spawned muxrd auto-detects and serves all three. zellij and tmux both
  # expose a session named "${SESSION}" (same-name cross-backend routing).
  # Gated behind the `all` profile; publishes the same host ports — run ONE rig
  # at a time.
  #   docker compose -f docker/compose.yaml --profile all up --build muxrd-all
  #   # or:  ./docker/run.sh --all [--host <lan-ip>]
  muxrd-all:
    profiles: ["all"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime-herdr-tmux
      args:
        # 0.46.0 or 0.45.1, the zellij versions muxrd supports
        ZELLIJ_VERSION: "${ZELLIJ_VERSION:-0.46.0}"
        # pinned to the last TESTED release (protocol 22); bump with wire.rs — see Dockerfile
        HERDR_VERSION: "${HERDR_VERSION:-0.9.5}"
        # Pinned tmux release and its tarball digest; they move together — see
        # the Dockerfile.
        TMUX_VERSION: "${TMUX_VERSION:-3.8}"
        TMUX_SHA256: "${TMUX_SHA256:-e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e}"
    image: muxr-all-rig
    container_name: muxr-all-rig
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRPC_PORT:-50051}:50051"
      - "${BIND_ADDR:-127.0.0.1}:${SSH_PORT:-2222}:22"
    environment:
      BACKEND: all
      SESSION: "${SESSION:-backend-dev}"
      MUXRD_SAN: "${MUXRD_SAN:-${BIND_ADDR:-}}"
      # In-container muxr-notify (FCM_MODE=log, e2e push-notification testing —
      # never published to the host). See docker/entrypoint.sh start_notify().
      NOTIFY_ENABLED: "${NOTIFY_ENABLED:-1}"
      NOTIFY_PORT: "${NOTIFY_PORT:-8090}"
    volumes:
      # Dedicated volumes, as for the multi-backend rig above: muxrd's state,
      # the managed zellij config and herdr's workspace state.
      - muxrd-all-data:/root/.local/share/zellij
      - zellij-all-config:/root/.config/zellij
      - herdr-all-data:/root/.config/herdr
    stdin_open: true
    tty: true

volumes:
  zellij-data:
  zellij-config:
  muxrd-herdr-data:
  herdr-data:
  muxrd-both-data:
  zellij-both-config:
  herdr-both-data:
  muxrd-tmux-data:
  muxrd-all-data:
  zellij-all-config:
  herdr-all-data:
