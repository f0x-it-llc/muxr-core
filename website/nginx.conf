server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  # text/html is always gzipped by nginx — listing it warns "duplicate MIME type".
  gzip_types text/plain text/css application/javascript image/svg+xml application/json;

  # --- Security headers ---------------------------------------------------
  # NOTE: nginx does NOT merge add_header across levels — as soon as a
  # location{} sets ANY add_header, it inherits NONE of the server-level
  # ones. So these four (+ HSTS) MUST be repeated verbatim in every location
  # that sets its own add_header (the cache blocks below). Do not "DRY" them
  # out by deleting the per-location copies — that silently strips the CSP
  # and friends from those responses. `always` emits them on error responses
  # too. HSTS is ignored over plain HTTP and only takes effect when this is
  # fronted by TLS termination — harmless to send here.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

  # Long-cache immutable static assets (fingerprint-free, but content is stable).
  location /assets/ {
    # Single consolidated Cache-Control (avoid the double header `expires` would add).
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    # Repeated security headers (see note above — required, not redundant):
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    try_files $uri =404;
  }

  # Muxr font catalog (the app's downloadable Nerd Fonts; populated by
  # website/fetch_fonts.sh before an image build). Immutable by contract: a
  # font file's content never changes under its name — a new font version
  # gets a new filename and a muxr-core manifest regen. Served from this host
  # because GitHub's anonymous release-download edge kills non-browser
  # clients (bot mitigation, connection reset without response —
  # wire-verified 2026-08-13); the app verifies every download against the
  # manifest's sha256 regardless of host.
  # The font CATALOG is the app's discovery root; the binaries below are
  # immutable by contract, but this file changes on deploy. It used to be
  # `no-cache`, which sent EVERY request through Cloudflare to this origin —
  # and an intermittent origin hang (~1 in 5 fetches stalling to the app's
  # 30s timeout, wire-verified 2026-08-15) made first catalog loads flaky on
  # devices. Now: short shared TTL + serve-stale, trading ≤5 min of
  # staleness after a deploy (fonts publish rarely; nothing here is urgent)
  # for edge-served reliability. `s-maxage=300` bounds edge staleness;
  # `stale-while-revalidate` serves the cached copy instantly while the edge
  # refreshes in the background, so a hanging origin never blocks a client;
  # `stale-if-error` keeps the catalog up through origin outages.
  # NOTE: Cloudflare does not cache `.json` by default (unlike the `.ttf`s
  # below, which is why downloads were always solid) — these headers only
  # take effect at the edge with a Cache Rule marking
  # muxr.app/fonts/manifest.json "eligible for cache" (respect origin TTL).
  # Exact match beats the /fonts/ prefix location regardless of order.
  # Served from here (not raw.githubusercontent.com) so font delivery has no
  # GitHub dependency at all — GitHub's edge blocking non-browser clients is
  # why fonts moved to this host in the first place.
  location = /fonts/manifest.json {
    add_header Cache-Control "public, max-age=60, s-maxage=300, stale-while-revalidate=86400, stale-if-error=86400" always;
    # Repeated security headers (see note above — required, not redundant):
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    try_files $uri =404;
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # Repeated security headers (see note above — required, not redundant):
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    try_files $uri =404;
  }

  # HTML must revalidate so deploys are picked up immediately.
  location ~ \.html$ {
    add_header Cache-Control "no-cache" always;
    # Repeated security headers (see note above — required, not redundant):
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    try_files $uri =404;
  }

  # Direct routing with 404 fallback. This block sets NO add_header, so it
  # inherits the server-level security headers. If you ever add an add_header
  # here, you MUST also repeat all the security headers (see the warning block
  # above) or the CSP and friends will be silently absent from these responses.
  location / {
    try_files $uri $uri/ =404;
  }
}
